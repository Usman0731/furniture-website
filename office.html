<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azeem Saleem — Home Furniture Collection</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;
      line-height:1.5;
      background:#efe9e3;
      color:#2b2b2b;
    }

    :root{
      --wood-1:#5a3b2e;
      --wood-2:#8f6a55;
      --accent:#cfa16b;
      --muted:#6b5a4a;
    }

    header{
      background:linear-gradient(90deg,var(--wood-1),#6f4f3f);
      color:#fff;
      padding:16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:relative;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .logo{
      display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;
    }
    .logo .mark{
      width:40px;height:40px;border-radius:8px;
      background:linear-gradient(135deg,var(--accent),#b7834a);
      display:flex;align-items:center;justify-content:center;
      color:#3b2a1f;font-weight:800;
    }

    nav ul{
      display:flex;gap:18px;list-style:none;
    }
    nav a{
      color:rgba(255,255,255,0.95);
      text-decoration:none;
      font-weight:600;
      padding:4px 8px;
      border-radius:4px;
    }
    /* nav a.active{
      background:rgba(255,255,255,0.2);
    } */

    /* Hamburger */
    .menu-toggle{
      display:none;
      flex-direction:column;
      gap:5px;
      cursor:pointer;
    }
    .menu-toggle span{
      width:25px;height:3px;background:#fff;border-radius:2px;
    }

    @media(max-width:768px){
      nav{
        display:none;
        flex-direction:column;
        background:linear-gradient(90deg,var(--wood-1),#6f4f3f);
        position:absolute;
        top:60px;right:0;width:100%;
        text-align:center;
      }
      nav.show{
        display:flex;
      }
      nav ul{
        flex-direction:column;
        gap:10px;
        padding:10px 0;
      }
      .menu-toggle{display:flex;}
    }

    /* Products */
    .container{
      max-width:1100px;
      margin:20px auto;
      padding:0 16px;
    }
    .container h2{
      margin-bottom:12px;
      color:var(--wood-1);
    }
    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:16px;
    }
    .product{
      background:#fff;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      overflow:hidden;
      border:1px solid rgba(0,0,0,0.05);
    }
    .product img{
      width:100%;height:200px;object-fit:cover;
    }
    .meta{padding:12px}
    .price{color:var(--wood-1);font-weight:700}
    .view-btn{
      display:inline-block;
      margin-top:8px;
      padding:8px 12px;
      background:var(--accent);
      color:#3b2a1f;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:600;
    }

     footer{padding:18px; background:#291f1b;color:#fff;margin-top:28px}
    .footer-inner{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;align-items:center}

    /* Modal */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      display:flex;
      align-items:center;
      justify-content:center;
      visibility:hidden;
      opacity:0;
      transition:0.3s;
      z-index:999;
    }
    .modal-backdrop.show{
      visibility:visible;
      opacity:1;
    }
    .modal{
      background:#fff;
      border-radius:10px;
      max-width:800px;
      width:95%;
      display:flex;
      flex-direction:row;
      overflow:hidden;
    }
    .modal img{
      width:50%;
      object-fit:cover;
    }
    .modal-content{
      padding:20px;
      flex:1;
    }
    .actions a{
      display:inline-block;
      padding:10px 12px;
      border-radius:6px;
      color:#fff;
      text-decoration:none;
      margin-right:8px;
    }
    .btn-call{background:#1b5f3a;}
    .btn-whatsapp{background:#25D366;}
    @media(max-width:700px){
      .modal{flex-direction:column;}
      .modal img{width:100%;height:200px;}
    }

    /* Floating buttons */
    .float-btns{
      position:fixed;
      right:16px;
      bottom:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index:999;
    }
    .float-btns a{
      display:flex;
      align-items:center;
      justify-content:center;
      width:48px;
      height:48px;
      border-radius:50%;
      color:#fff;
      text-decoration:none;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      font-size:22px;
    }
    .call{background:#1b5f3a;}
    .whatsapp{background:#25D366;}

    /* Floating WhatsApp Button */
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1002;
  background-color: #25D366;
  border-radius: 50%;
  padding: 10px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  display: none;
}
.whatsapp-float img {
  width: 40px;
  height: 40px;
}
.whatsapp-float:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 12px rgba(0,0,0,0.4);
}

/* ✅ Show only on mobile screens */
@media (max-width: 768px) {
  .whatsapp-float {
    display: block;
    bottom: 15px;
    right: 15px;
    padding: 8px;
  }
  .whatsapp-float img {
    width: 36px;
    height: 36px;
  }
}

  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark">AS</div>
    <div>Azeem Saleem</div>
  </div>

  <div class="menu-toggle" id="menuToggle">
    <span></span><span></span><span></span>
  </div>

  <nav id="navMenu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="house.html" class="active">Furniture</a></li>
      <li><a href="office.html">Office</a></li>
      <!-- <li><a href="index.html#custom">Custom Order</a></li> -->
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <h2>Office Products</h2>
  <div class="products" id="productGrid"></div>

  <section id="contact" style="margin-top:22px">
      <h2>Contact</h2>
      <p class="small">Address: WirelessPull — Rahim Yar Khan, Pakistan</p>
      <p class="small">Phone: <a href="tel:+923337480888">+92 3337480888</a> | WhatsApp: <a href="https://wa.me/923337480888">Message us</a></p>
    </section>
</main>

<footer>
    <div class="footer-inner">
      <div>
        <strong>Azeem Saleem</strong>
        <div style="font-size:13px;opacity:0.9">Wood Furniture — Pakistan</div>
      </div>
      <div>
        <a href="https://wa.me/923337480888" style="color:#fff;text-decoration:none;font-weight:700">WhatsApp</a>
      </div>
    </div>
  </footer>

<!-- Floating mobile actions -->
  <!-- <div class="mobile-actions" aria-hidden="true">
    <a class="fab fab--wa" id="fabWa" href="https://wa.me/923337480888" title="WhatsApp" aria-label="WhatsApp">WA</a>
    <a class="fab fab--call" id="fabCall" href="tel:+923337480888" title="Call" aria-label="Call">☎</a>
  </div> -->

  <!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <img id="modalImg" src="" alt="">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
      <p><strong id="modalPrice"></strong></p>
      <div class="actions">
        <a id="callBtn" class="btn-call" href="tel:+923337480888">Call</a>
        <a id="waBtn" class="btn-whatsapp" href="https://wa.me/923337480888">WhatsApp</a>
      </div>
      <div style="margin-top:10px;">
        <button id="closeModal" class="view-btn">Close</button>
      </div>
    </div>
  </div>
</div>

 <a href="https://wa.me/923337480888" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp" />
</a>

<script>
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');
menuToggle.addEventListener('click', ()=> navMenu.classList.toggle('show'));

const products = [
  {id:1,title:'Oak Dining Table',price:'PKR 100,000',img:'https://images.unsplash.com/photo-1540574163026-643ea20ade25?auto=format&fit=crop&w=1200&q=60',desc:'Solid oak dining table — seats 6 comfortably. Finished with natural oil.'},
  {id:2,title:'Classic Wooden Bed',price:'PKR 100,000',img:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=60',desc:'King-size bed with solid frame and storage drawers.'},
  {id:3,title:'Ergonomic Office Desk',price:'PKR 100,500',img:'https://images.unsplash.com/photo-1586105251261-72a756497a5b?auto=format&fit=crop&w=1200&q=60',desc:'Spacious desk with cable management and wood veneer.'},
  {id:4,title:'Wooden Bookshelf',price:'PKR 100,900',img:'https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1200&q=60',desc:'Five-tier bookshelf for living room or office.'},
  {id:5,title:'Coffee Table',price:'PKR 100,800',img:'https://images.unsplash.com/photo-1493666438817-866a91353ca9?auto=format&fit=crop&w=1200&q=60',desc:'Low coffee table with brass inlay.'},
  {id:6,title:'Reception Sofa',price:'PKR 100,000',img:'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=1200&q=60',desc:'Comfortable three-seater — upholstered and strong wooden base.'}
];

const grid = document.getElementById('productGrid');
products.forEach(p=>{
  const el = document.createElement('div');
  el.className='product';
  el.innerHTML=`
    <img src="${p.img}" alt="${p.title}">
    <div class="meta">
      <strong>${p.title}</strong><br>
      <span class="price">${p.price}</span><br>
      <p style="font-size:13px;color:var(--muted);margin-top:4px">${p.desc.slice(0,60)}...</p>
      <button class="view-btn" data-id="${p.id}">View Details</button>
    </div>`;
  grid.appendChild(el);
});

// Modal Logic
const modal=document.getElementById('modalBackdrop');
const modalImg=document.getElementById('modalImg');
const modalTitle=document.getElementById('modalTitle');
const modalDesc=document.getElementById('modalDesc');
const modalPrice=document.getElementById('modalPrice');
const waBtn=document.getElementById('waBtn');
const callBtn=document.getElementById('callBtn');

grid.addEventListener('click',e=>{
  const btn=e.target.closest('.view-btn');
  if(!btn)return;
  const p=products.find(x=>x.id==btn.dataset.id);
  modalImg.src=p.img;
  modalTitle.textContent=p.title;
  modalDesc.textContent=p.desc;
  modalPrice.textContent=p.price;
  waBtn.href=`https://wa.me/923337480888?text=${encodeURIComponent('Hello, I am interested in '+p.title)}`;
  callBtn.href='tel:+923337480888';
  modal.classList.add('show');
});
document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show');});
</script>
</body>
</html>
